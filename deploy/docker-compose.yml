# Typoza 云端保存服务自托管编排:server + PostgreSQL 17 + Caddy(自动 HTTPS)。
# 块密文默认存在本机磁盘卷(blobdata);要用 S3 / R2 / B2 等对象存储,把 TYPOZA_BLOB_DRIVER 改为 s3 并补齐 TYPOZA_S3_*。
# 用法(在 deploy/ 目录):cp .env.example .env,按注释生成并填写密钥,然后 docker compose up -d。
# 所有密钥只从 .env 注入,本文件不含任何真实密钥。

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: typoza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: typoza
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typoza -d typoza"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [typoza]

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: typoza-server:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TYPOZA_LISTEN: ":8080"
      TYPOZA_METRICS_LISTEN: ":9090" # 指标只在容器网络内可达,不经 Caddy 暴露
      TYPOZA_DATABASE_URL: postgres://typoza:${POSTGRES_PASSWORD}@postgres:5432/typoza?sslmode=disable
      TYPOZA_BLOB_DRIVER: ${TYPOZA_BLOB_DRIVER:-fs}
      TYPOZA_BLOB_FS_DIR: /data/blobs
      TYPOZA_S3_ENDPOINT: ${TYPOZA_S3_ENDPOINT:-}
      TYPOZA_S3_BUCKET: ${TYPOZA_S3_BUCKET:-typoza}
      TYPOZA_S3_ACCESS_KEY: ${TYPOZA_S3_ACCESS_KEY:-}
      TYPOZA_S3_SECRET_KEY: ${TYPOZA_S3_SECRET_KEY:-}
      TYPOZA_S3_REGION: ${TYPOZA_S3_REGION:-}
      TYPOZA_S3_USE_TLS: ${TYPOZA_S3_USE_TLS:-true}
      TYPOZA_JWT_PRIVATE_KEY: ${TYPOZA_JWT_PRIVATE_KEY:?请在 .env 中设置 TYPOZA_JWT_PRIVATE_KEY}
      TYPOZA_DATA_KEY: ${TYPOZA_DATA_KEY:?请在 .env 中设置 TYPOZA_DATA_KEY}
      TYPOZA_ENUM_SECRET: ${TYPOZA_ENUM_SECRET:?请在 .env 中设置 TYPOZA_ENUM_SECRET}
      TYPOZA_REGISTRATION: ${TYPOZA_REGISTRATION:-open}
      TYPOZA_QUOTA_BYTES: ${TYPOZA_QUOTA_BYTES:-10737418240}
      # 只信 Caddy 所在网段传来的 X-Forwarded-For;网段由下方 networks 固定。
      TYPOZA_TRUSTED_PROXIES: 172.30.89.0/24
      TYPOZA_LOG_LEVEL: ${TYPOZA_LOG_LEVEL:-info}
    volumes:
      - blobdata:/data
    networks: [typoza]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TYPOZA_DOMAIN: ${TYPOZA_DOMAIN:?请在 .env 中设置 TYPOZA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?请在 .env 中设置 ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [typoza]

networks:
  typoza:
    ipam:
      config:
        - subnet: 172.30.89.0/24

volumes:
  pgdata:
  blobdata:
  caddydata:
  caddyconfig:
