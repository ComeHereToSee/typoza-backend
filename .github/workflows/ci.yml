name: ci

on:
  push:
    branches: [dev, main]
    # 只改文档不跑:私有仓库的 Actions 分钟数有限(macOS 按 10 倍计)。
    # 空提交没有改动文件,同样会被这条过滤掉;要重跑用 Actions 页面的 Run workflow
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write # ci/publish.sh 把日志与产物推到 ci/<job> 分支

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_OUT: ${{ github.workspace }}/ci-out

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: typoza
          POSTGRES_PASSWORD: typoza
          POSTGRES_DB: typoza
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U typoza" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TYPOZA_TEST_DATABASE_URL: postgres://typoza:typoza@localhost:5432/typoza?sslmode=disable
      TYPOZA_TEST_S3_ENDPOINT: localhost:9000
      TYPOZA_TEST_S3_ACCESS_KEY: rustfsadmin
      TYPOZA_TEST_S3_SECRET_KEY: rustfsadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: s3
        run: ci/step.sh s3 ci/start-s3.sh
      - name: vet
        if: ${{ !cancelled() }}
        run: ci/step.sh vet go vet ./...
      - name: test
        if: ${{ !cancelled() }}
        run: ci/step.sh test go test -race -count=1 -v -coverprofile="$CI_OUT/coverage.out" ./...
      - name: sdk vet
        if: ${{ !cancelled() }}
        run: ci/step.sh sdk-vet bash -c "cd sdk && go vet ./..."
      - name: sdk test
        if: ${{ !cancelled() }}
        run: ci/step.sh sdk-test bash -c "cd sdk && go test -race -count=1 ./..."
      - name: govulncheck
        if: ${{ !cancelled() }}
        # -show verbose:「依赖里有、代码没调用」的漏洞也列出模块与编号,便于留档与升级
        run: ci/step.sh govulncheck go run golang.org/x/vuln/cmd/govulncheck@latest -show verbose ./...
      - name: gosec
        if: ${{ !cancelled() }}
        env:
          GOTOOLCHAIN: go1.26.9 # gosec v2.29.0 依赖的 x/tools v0.49.0 读不了 Go 1.27 导出数据
        run: ci/step.sh gosec go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -exclude-generated -severity medium ./...
      # sdk/ 是独立模块,根目录的 ./... 扫不到它;端到端加密的代码在这里
      - name: sdk govulncheck
        if: ${{ !cancelled() }}
        run: ci/step.sh sdk-govulncheck bash -c "cd sdk && go run golang.org/x/vuln/cmd/govulncheck@latest -show verbose ./..."
      - name: sdk gosec
        if: ${{ !cancelled() }}
        env:
          GOTOOLCHAIN: go1.26.9
        run: ci/step.sh sdk-gosec bash -c "cd sdk && go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -exclude-generated -severity medium ./..."
      - name: publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/publish.sh test "${{ job.status }}"

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: cross build
        run: |
          mkdir -p "$CI_OUT/artifacts"
          ci/step.sh build-linux-amd64 env CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/typoza-server-linux-amd64 ./cmd/typoza-server
          ci/step.sh build-darwin-arm64 env CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o "$CI_OUT/artifacts/typoza-server-darwin-arm64" ./cmd/typoza-server
      - name: docker build
        if: ${{ !cancelled() }}
        run: ci/step.sh docker-build docker build -f deploy/Dockerfile -t typoza-server:ci .
      - name: publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/publish.sh build "${{ job.status }}"
